[project]
name = "etcad"
version = "1.1.0"
description = "MCP server for electrical CAD drawings: read, edit and create DWG without a CAD, PDF to DWG with real texts, and a live AutoCAD-style view where you and Claude draw together"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "claude", "cad", "dwg", "dxf", "autocad", "pdf-to-dwg", "electrical", "wiring", "ezdxf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "mcp>=1.6,<2",
    "ezdxf>=1.3",
    "pymupdf>=1.24",
    "shapely>=2.0",
    "pillow>=10",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform=='win32'",
]

[project.optional-dependencies]
# OCR offline per ricostruire i testi "esplosi" dei PDF (consigliato per pdf_a_dwg)
ocr = ["rapidocr_onnxruntime>=1.3"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Samuk734/ETCAD"
Issues = "https://github.com/Samuk734/ETCAD/issues"

[project.scripts]
etcad = "etcad.server:main"
etcad-vista = "etcad.vista.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etcad"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/media/*.mp4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
